<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7ff">
  <title>Fetch Something Fun</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #20243a;
      background: #f5f7ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      display: grid;
      place-items: center;
    }

    main {
      width: min(100%, 680px);
      padding: clamp(24px, 6vw, 48px);
      background: #fff;
      border: 1px solid #e5e8f3;
      border-radius: 24px;
      box-shadow: 0 18px 55px rgb(34 45 90 / 10%);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3rem);
      letter-spacing: -0.05em;
      line-height: 1.1;
    }

    .description {
      margin: 14px 0 28px;
      color: #5e647a;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    button {
      min-height: 46px;
      padding: 11px 18px;
      border: 0;
      border-radius: 12px;
      background: #4d55d8;
      color: #fff;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      transition: background-color 150ms ease, transform 150ms ease;
    }

    button:hover:not(:disabled) {
      background: #373fbd;
      transform: translateY(-1px);
    }

    button:focus-visible {
      outline: 3px solid #aeb2ff;
      outline-offset: 3px;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    #result {
      min-height: 130px;
      margin-top: 28px;
      padding: 22px;
      display: grid;
      place-items: center;
      border: 1px solid #e5e8f3;
      border-radius: 16px;
      background: #fafaff;
      text-align: center;
    }

    #result p {
      margin: 0;
      color: #5e647a;
      line-height: 1.6;
    }

    #result .error {
      color: #a52d3a;
    }

    #result .advice {
      color: #20243a;
      font-size: 1.2rem;
      font-weight: 600;
    }

    #result img {
      display: block;
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      border-radius: 10px;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 14px;
      }

      main {
        border-radius: 18px;
      }

      .buttons {
        display: grid;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Fetch Something Fun</h1>
    <p class="description">
      Need a smile or a little inspiration? Fetch a random dog, get a piece of advice,
      or let us surprise you.
    </p>

    <div class="buttons" aria-label="Choose what to fetch">
      <button type="button" data-choice="dog">Get a Dog</button>
      <button type="button" data-choice="advice">Get Advice</button>
      <button type="button" data-choice="surprise">Surprise Me</button>
    </div>

    <section id="result" aria-live="polite" aria-busy="false" aria-label="Result">
      <p>Choose a button to fetch something fun!</p>
    </section>
  </main>

  <script>
    const buttons = document.querySelectorAll("button[data-choice]");
    const result = document.getElementById("result");
    let isLoading = false;

    async function showDog() {
      const response = await fetch("https://dog.ceo/api/breeds/image/random");

      if (!response.ok) {
        throw new Error("Request failed: " + response.status);
      }

      // The first await waits for the HTTP response; the second reads its JSON body.
      const data = await response.json();

      // data.message contains the random dog's image URL.
      if (!data.message) {
        throw new Error("The dog image was missing from the response.");
      }

      const image = document.createElement("img");
      image.src = data.message;
      image.alt = "A random, adorable dog";
      result.replaceChildren(image);
    }

    async function showAdvice() {
      const response = await fetch("https://api.adviceslip.com/advice");

      if (!response.ok) {
        throw new Error("Request failed: " + response.status);
      }

      // The first await waits for the HTTP response; the second reads its JSON body.
      const data = await response.json();

      // data.slip.advice contains the advice text.
      if (!data.slip || !data.slip.advice) {
        throw new Error("Advice was missing from the response.");
      }

      const advice = document.createElement("p");
      advice.className = "advice";
      advice.textContent = data.slip.advice;
      result.replaceChildren(advice);
    }

    async function fetchSomething(choice) {
      if (isLoading) {
        return;
      }

      isLoading = true;
      buttons.forEach(function (button) {
        button.disabled = true;
      });
      result.setAttribute("aria-busy", "true");
      const loadingMessage = document.createElement("p");
      loadingMessage.textContent = "Loading...";
      result.replaceChildren(loadingMessage);

      try {
        let selectedChoice = choice;
        if (choice === "surprise") {
          selectedChoice = Math.random() < 0.5 ? "dog" : "advice";
        }

        if (selectedChoice === "dog") {
          await showDog();
        } else {
          await showAdvice();
        }
      } catch (error) {
        console.error("Could not fetch something fun:", error);
        const errorMessage = document.createElement("p");
        errorMessage.className = "error";
        errorMessage.textContent = "Something went wrong. Please try again.";
        result.replaceChildren(errorMessage);
      } finally {
        isLoading = false;
        buttons.forEach(function (button) {
          button.disabled = false;
        });
        result.setAttribute("aria-busy", "false");
      }
    }

    buttons.forEach(function (button) {
      button.addEventListener("click", function () {
        fetchSomething(button.dataset.choice);
      });
    });
  </script>
</body>
</html>
