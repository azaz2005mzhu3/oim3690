<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/styles.css">

<body>
    <header>
        <h1>Hello, I'm Menglu (Alice)</h1>
        <nav>
            <ul>

            </ul>
        </nav>
    </header>

    <main>
        <section class="playlist-app">
            <h2>My Playlist</h2>

            <form id="playlist-form" class="playlist-form">
                <input
                    type="text"
                    id="song-input"
                    placeholder="Add a song title..."
                    autocomplete="off"
                    required
                >
                <button type="submit">Add Song</button>
            </form>

            <ul id="playlist" class="playlist-list"></ul>

            <p id="playlist-empty" class="playlist-empty">No songs yet. Add one above!</p>

            <div class="playlist-footer">
                <span id="playlist-count">0 songs</span>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Menglu (Alice). Built for OIM3690.</p>
    </footer>

    <script src="js/playlist.js"></script>
</body>
