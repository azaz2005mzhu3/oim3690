<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spending Tracker</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 480px;
        margin: 40px auto;
        padding: 0 16px;
        color: #222;
      }
      form {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      input {
        min-width: 0;
        flex: 1;
        padding: 8px;
        font-size: 1rem;
      }
      button {
        padding: 8px 14px;
        font-size: 1rem;
        cursor: pointer;
      }
      #expense-list {
        padding-left: 20px;
      }
      #expense-list button {
        margin-left: 8px;
        padding: 2px 8px;
        font-size: 0.85rem;
      }
      #message {
        color: #b00020;
        min-height: 1.4em;
      }
      #total {
        font-size: 1.4rem;
        font-weight: bold;
      }
      @media (max-width: 520px) {
        form { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <h1>Spending Tracker</h1>

    <form id="expense-form" novalidate>
      <input id="name" aria-label="Expense name" placeholder="What did you buy?" />
      <input id="amount" type="number" step="0.01" aria-label="Amount in dollars" placeholder="Amount" />
      <button type="submit">Add</button>
    </form>

    <p id="message" role="alert"></p>

    <ul id="expense-list"></ul>

    <p aria-live="polite">Total: <span id="total">$0.00</span></p>
    <p>Expenses: <span id="count">0</span></p>
    <p>Largest expense: <span id="largest">None yet</span></p>
    <script>
      const form = document.querySelector("#expense-form");
      const nameInput = document.querySelector("#name");
      const amountInput = document.querySelector("#amount");
      const list = document.querySelector("#expense-list");
      const totalOutput = document.querySelector("#total");
      const message = document.querySelector("#message");
      const countOutput = document.querySelector("#count");
      const largestOutput = document.querySelector("#largest");

      // Keep all expenses between submissions.
      const expenses = [];

      // Adds up the cost of every expense in the array.
      function totalOf(items) {
        let totalCents = 0;
        for (const item of items) {
          totalCents += Math.round(item.cost * 100);
        }
        return totalCents / 100;
      }

      // Redraws the list and the total from an array of expenses.
      function render(items) {
        list.innerHTML = "";
        for (const [index, item] of items.entries()) {
          const li = document.createElement("li");
          li.textContent = `${item.name}: $${item.cost.toFixed(2)} `;

          const deleteButton = document.createElement("button");
          deleteButton.textContent = "Delete";
          deleteButton.type = "button";
          deleteButton.setAttribute("aria-label", `Delete ${item.name}`);
          deleteButton.addEventListener("click", () => {
            expenses.splice(index, 1);
            render(expenses);
          });

          li.appendChild(deleteButton);
          list.appendChild(li);
        }
        totalOutput.textContent = `$${totalOf(items).toFixed(2)}`;
        countOutput.textContent = String(items.length);

        let largest = null;
        for (const item of items) {
          if (largest === null || item.cost > largest.cost) {
            largest = item;
          }
        }
        largestOutput.textContent = largest === null
          ? "None yet"
          : `${largest.name}: $${largest.cost.toFixed(2)}`;
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        const name = nameInput.value.trim();
        const amount = amountInput.value.trim();
        const cost = Number(amount);

        if (name === "" || amount === "" || !Number.isFinite(cost) || cost <= 0) {
          message.textContent = "Enter what you bought and an amount above zero.";
          return;
        }

        if (Math.round(cost * 100) <= 0 ||
            !Number.isSafeInteger(Math.round(cost * 100)) ||
            Math.abs(cost * 100 - Math.round(cost * 100)) > 0.000001 ||
            !Number.isSafeInteger(Math.round(totalOf(expenses) * 100) + Math.round(cost * 100))) {
          message.textContent = "Enter a valid amount with no more than two decimal places.";
          return;
        }

        message.textContent = "";
        expenses.push({ name: name, cost: cost });
        form.reset();
        render(expenses);
        nameInput.focus();
      });

      render(expenses);
    </script>
  </body>
</html>
